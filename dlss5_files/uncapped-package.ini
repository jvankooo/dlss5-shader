; DLSS 5 for Uncapped: ReShade 6.8, RenoDX DLSS5 v10.8 and the dlss5-feed 2.0
; bridge, set up for the bridge route -- DLSS 5 runs once per captured frame
; on Uncapped's own stage, before frame generation.
;
; Everything lives in shaders/dlss5/ except ReShade's dxgi.dll and
; ReShade.ini, which ReShade needs beside Uncapped.exe. Strength, style and
; passes are under RenoDX DLSS5 in Uncapped's menu. See
; docs/dlss5-package.md in the Uncapped source.
[package]
name            = RenoDX DLSS5
target          = app
platforms       = windows
gpu             = nvidia
min_app_version = 0.2
